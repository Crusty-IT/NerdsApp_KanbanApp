name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish Backend
        run: dotnet publish KanbanApp.Backend/KanbanApp.Backend.csproj -c Release -o ./publish --self-contained -r linux-x64

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'shellty-kanban-api'
          package: ./publish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd KanbanApp.Frontend
          npm ci
          npm run build

      - name: Deploy Frontend
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'shellty-kanban'
          package: ./KanbanApp.Frontend/dist