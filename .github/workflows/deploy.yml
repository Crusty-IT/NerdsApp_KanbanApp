name: Deploy

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore

      - name: Test backend
        run: dotnet test --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: KanbanApp.Frontend/package-lock.json

      - name: Build frontend
        working-directory: KanbanApp.Frontend
        run: |
          npm ci
          npm run build

  deploy-backend:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi

          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL"
